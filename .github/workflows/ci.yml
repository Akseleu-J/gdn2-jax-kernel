name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pytest
    - name: Run CPU tests
      run: |
        pytest tests/test_imports.py tests/test_reference.py -v
    # Опционально: можно добавить запуск TPU-тестов, если есть раннер с TPU,
    # но для обычного CI пропускаем.
